name: CI Build

concurrency:
  group: ci-build
  cancel-in-progress: true

env:
  GITCLIFF_VER: 2.13.1
  FORGEJO_API_URL: https://git.egoroff.spb.ru/api/v1

on:
  push:
    branches:
      - master
      - develop
    tags:
      - "v*"
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: docker
    container:
      image: registry.egoroff.spb.ru/zigcross:0.16

    steps:
      - name: Query version
        id: get_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            ver="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "using version ${ver}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v3

      - name: Trust mise config
        run: mise trust

      - name: Build archives
        run: just ver=${{ steps.get_version.outputs.version }} build-all

      - name: Build OpenWrt apk packages
        run: just ver=${{ steps.get_version.outputs.version }} openwrt-apk

      - name: Upload archives
        uses: actions/upload-artifact@v3
        with:
          name: archives
          path: zig-out/*.tar.gz

      - name: Upload apk packages
        uses: actions/upload-artifact@v3
        with:
          name: apk
          path: zig-out/apk/**/*.apk

  generate-changelog:
    name: Generate changelog
    if: startsWith(forgejo.ref, 'refs/tags/v')
    runs-on: docker
    outputs:
      release_body: ${{ steps.changelog.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -fL \
            https://github.com/orhun/git-cliff/releases/download/v${{ env.GITCLIFF_VER }}/git-cliff-${{ env.GITCLIFF_VER }}-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz
          install git-cliff-${{ env.GITCLIFF_VER }}/git-cliff /usr/local/bin/git-cliff

      - name: Generate a changelog
        id: changelog
        run: |
          BODY="$(git cliff --latest --strip header --gitea-token ${{ secrets.FORGEJO_TOKEN }})"
          echo "release_body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  release:
    name: Forgejo Release
    needs: [build, generate-changelog]
    if: startsWith(forgejo.ref, 'refs/tags/v')
    runs-on: docker
    steps:
      - name: Query version
        id: get_version
        shell: bash
        run: |
          ver="${GITHUB_REF#refs/tags/v}"
          echo "using version ${ver}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: release

      - name: Prepare release artifacts
        run: |
          find release -type f -name '*.tar.gz' -exec mv -v {} release/ \;
          # Unique flat names for Forgejo assets; Image Builder needs name-version.apk
          # (copy from zig-out/apk/<arch>/ or rename: drop .<arch> before the .apk).
          while IFS= read -r -d '' f; do
            arch="$(basename "$(dirname "$f")")"
            base="$(basename "$f" .apk)"
            mv -v "$f" "release/${base}-${arch}.apk"
          done < <(find release -type f -name '*.apk' -print0)
          ls -la release/

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update && apt-get install -y jq
          fi

      - name: Check API access
        env:
          FORGEJO_URL: ${{ env.FORGEJO_API_URL }}
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          test -n "$TOKEN" || { echo "FORGEJO_TOKEN secret is empty"; exit 1; }
          test -n "$REPO" || { echo "github.repository is empty"; exit 1; }
          echo "API=$FORGEJO_URL repo=$REPO"
          curl -fsS -H "Authorization: token $TOKEN" \
            -H "Accept: application/json" \
            "$FORGEJO_URL/repos/$REPO" | jq -r '"ok: \(.full_name) id=\(.id)"'

      - name: Create Release via API
        id: create_release
        env:
          FORGEJO_URL: ${{ env.FORGEJO_API_URL }}
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: v${{ steps.get_version.outputs.version }}
          RELEASE_BODY: ${{ needs.generate-changelog.outputs.release_body }}
        run: |
          URL="$FORGEJO_URL/repos/$REPO/releases"
          echo "POST $URL tag=$VERSION"

          PAYLOAD=$(jq -n \
            --arg tag "$VERSION" \
            --arg name "$VERSION" \
            --arg body "$RELEASE_BODY" \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}')

          RESPONSE=$(curl -sS -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$PAYLOAD" \
            "$URL")

          echo "Response: $RESPONSE"

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "Failed to create release. Response: $RESPONSE"
            exit 1
          fi

          echo "Created release with ID: $RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload Assets
        env:
          FORGEJO_URL: ${{ env.FORGEJO_API_URL }}
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        run: |
          shopt -s nullglob
          for file in release/*.tar.gz release/*.apk; do
            filename=$(basename "$file")
            echo "Uploading $filename..."
            curl -fsS -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              -H "Accept: application/json" \
              --data-binary @"$file" \
              "$FORGEJO_URL/repos/$REPO/releases/$RELEASE_ID/assets?name=$filename"
            echo
          done
